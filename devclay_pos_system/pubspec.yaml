name: devclay_pos_system
description: DevClayPOS — premium offline-first Point of Sale for Pakistan.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

isar_version: &isar_version 3.3.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  go_router: ^15.1.2
  fl_chart: ^0.71.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  window_manager: ^0.4.3
  material_symbols_icons: ^4.2874.0
  crypto: ^3.0.6
  ffi: ^2.1.3
  file_picker: ^8.1.7
  image: ^4.5.4
  crop_your_image: ^2.0.0
  uuid: ^4.5.1
  barcode: ^2.2.9
  barcode_widget: ^2.0.4
  printing: ^5.14.2
  pdf: ^3.11.3
  csv: ^6.0.0
  archive: ^4.0.2
  win32: ^5.15.0
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.6
  http: ^1.2.2
  encrypt: ^5.0.3
  audioplayers: ^6.4.0
  devclay_license_core:
    path: ../packages/devclay_license_core
  isar_community:
    version: *isar_version
  isar_community_flutter_libs:
    version: *isar_version

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  isar_community_generator:
    version: *isar_version
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256
  web:
    generate: true
    background_color: '#0B1220'
    theme_color: '#2563EB'

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/sounds/
  fonts:
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
